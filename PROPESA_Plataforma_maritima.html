 <div class="cd"><div class="bar" style="margin-top:0"><h3 style="margin:0">Usuarios</h3><button class="btn" data-a="nu">+ Nuevo usuario</button></div>
 ${uf?`<div class="panel"><div class="f"><label>Nombre<input id="un" value="${E(u.name||'')}"></label><label>Correo<input id="ue" value="${E(u.email||'')}"></label><label>Contraseña<input id="up" value="${E(u.pw||'')}"></label><label>Rol<select id="ur">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}" ${u.role==k?'selected':''}>${v}</option>`).join('')}</select></label><label>Recibe informes<span style="padding-top:6px">${sw(u.notify!==false&&(u.notify||!u.id),'un')}</span></label><button class="btn" data-a="su">Guardar</button><button class="btn s" data-a="cu">Cancelar</button></div><p class="er">${E(msg)}</p></div>`:''}
 <div class="tbl"><table class="lf"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Informes</th><th></th></tr></thead><tbody>${ST.U.map(x=>`<tr><td>${E(x.name)}</td><td>${E(x.email)}</td><td>${ROLE[x.role]}</td><td>${x.notify?'Sí':'No'}</td><td><button class="lnk" data-eu="${x.id}">Editar</button> ${x.id==me.id?'':conf=='u'+x.id?`<button class="btn d" data-du2="${x.id}">Confirmar</button>`:`<button class="lnk" data-du="${x.id}">Eliminar</button>`}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="g2"><div class="cd"><h3>Qué puede hacer cada rol</h3><div class="tbl"><table><thead><tr><th>Acción</th><th>Admin</th><th>Piso</th><th>Consulta</th></tr></thead><tbody>${yes('Ver todo',1,1)}${yes('Capturar cajas y conteos',1,0)}${yes('Crear / eliminar lotes',0,0)}${yes('Cerrar lotes y empaques',0,0)}${yes('Gestionar usuarios',0,0)}</tbody></table></div></div>
 <div class="cd"><h3>Correos enviados (${ST.O.length})</h3><p class="mut">Al cerrar un empaque se envía el informe a los usuarios con “Recibe informes” (simulado en esta demo).</p>${ST.O.map(o=>`<details><summary>${E(o.subject)} · ${o.t}</summary><p class="mut">Para: ${o.to.map(E).join(', ')}</p><pre>${E(o.body)}</pre></details>`).join('')||'<p class="mut">Aún no hay correos.</p>'}</div></div>
 <div class="cd"><h3>¿Dónde se guarda cada dato?</h3><div class="tbl"><table class="lf"><thead><tr><th>Dato</th><th>Tabla en el sistema real (PostgreSQL)</th><th>En esta demo</th></tr></thead><tbody>${[['N° de caja, langostas, categoría','receipt_boxes / packing_list_boxes'],['Lotes y recepciones','lots, receipts, receipt_items'],['Movimientos, conteo final y mortalidad calculada','inventory_movements, lots.final_count, mortality_records'],['Envíos y peso bruto','shipments, packing_lists, packing_list_weight_lines'],['Usuarios, roles, permisos','users, roles, permissions (contraseña con hash)'],['Correos y avisos','notification_rules + cola de tareas + proveedor de correo'],['Quién cambió qué','audit_logs (solo inserción)']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>este navegador</td></tr>`).join('')}</tbody></table></div><p class="mut">En producción todo vive en el servidor, con respaldos y auditoría.</p><div class="bar"><button class="btn d" data-a="rst">Restablecer demo</button></div></div></div>`}
function loginView(){return `<div class="login"><div class="cd"><div style="max-width:260px;margin:0 auto 6px">${LOGO}</div><p class="mut">Plataforma marítima · acceso por rol</p><div class="f" style="flex-direction:column;align-items:stretch"><label>Correo<input id="le" autocomplete="username"></label><label>Contraseña<input id="lp" type="password" autocomplete="current-password"></label><button class="btn" data-a="lg">Entrar</button></div><p class="er" id="lm"></p><p class="mut">Demo: <button class="lnk" data-q="admin@propesa.mx,admin123">Administrador</button> <button class="lnk" data-q="piso@propesa.mx,piso123">Encargado de piso</button></p></div></div>`}
/* ---------- NÚCLEO ---------- */
const PG={inicio,recepcion,lote,cajas,caja,embarques,emb:i=>emb(+i),cierre,temperatura,admin,buscar},STEP={recepcion:1,lote:1,cajas:2,caja:2,embarques:3,emb:3,cierre:4};
function render(){const A=document.getElementById('app');if(!me){A.innerHTML=loginView();return}if(!ST.M)seedM();
 if(V.v=='admin'&&me.role!='admin')V={v:'inicio'};const o=document.querySelector('main'),sc=o?o.scrollTop:0,s=STEP[V.v]||0,fb=lots().reduce((a,l)=>a+filled(l),0),tb=ST.R.reduce((a,r)=>a+r.nb,0);
 const steps=[['recepcion',1,'Recepción',`${ST.R.length} lotes`],['cajas',2,'Cajas',`${fb}/${tb} capturadas`,fb<tb],['embarques',3,'Embarque',`${ST.P.filter(p=>p.closed).length}/${ST.P.length} cerrados`,ST.P.some(p=>!p.closed)],['cierre',4,'Cierre y mortalidad',`${ST.R.filter(r=>r.closed).length}/${ST.R.length} lotes`,ST.R.some(r=>!r.closed)]];
 A.innerHTML=`<div class="shell"><a class="skip" href="#main">Saltar al contenido</a><aside class="sb" aria-label="Menú principal"><div class="lt">${LOGOD}</div><h4>Operación</h4><button class="fs ${V.v=='inicio'?'on':''}" data-go="inicio" ${V.v=='inicio'?'aria-current="page"':''}><i>${IC.inicio}</i><span><b>Panel</b><small>Siguiente paso</small></span></button>${steps.map(([k,n,t,sub,pn])=>`<button class="fs ${s==n?'on':''}${pn?' pn':''}" data-go="${k}" ${s==n?'aria-current="page"':''}><i>${IC[k]}<em>${n}</em></i><span><b>${t}</b><small>${pn?'⚠ ':''}${sub}</small></span></button>`).join('')}<span class="sp"></span><h4>Sistema</h4><button class="fs sm ${V.v=='temperatura'?'on':''}" data-go="temperatura" ${V.v=='temperatura'?'aria-current="page"':''}><i>${IC.temperatura}</i><span><b>Temperatura</b></span></button>${me.role=='admin'?`<button class="fs sm ${V.v=='admin'?'on':''}" data-go="admin" ${V.v=='admin'?'aria-current="page"':''}><i>${IC.admin}</i><span><b>Administración</b></span></button>`:''}<div style="height:12px"></div></aside><div class="scr" data-sb="0"></div><div class="ct"><header class="hd"><button class="mb" data-sb="1" aria-label="Menú">☰</button><input id="sq" type="search" placeholder="Buscar lote, o lote + caja (WLRCO021026 42)" aria-label="Buscar"><div class="usr"><span class="zs" role="group" aria-label="Tamaño de letra">${ZL.map(([t,z,a],i)=>`<button class="lnk zb${i}" data-z="${z}" aria-pressed="${Z==z}" aria-label="${a}">${t}</button>`).join('')}</span><b>${E(me.name)}</b><span class="chip">${ROLE[me.role]}</span><button class="lnk w" data-a="lo">Salir</button></div></header>${ctxBar()}<main id="main" tabindex="-1">${PG[V.v](V.id)}</main></div></div>`;
 document.querySelector('main').scrollTop=sc;const q=document.getElementById('sq');if(q&&V.v=='buscar')q.value=V.id||''}
function go(s){const[v,...r]=s.split(':');V={v,id:r.join(':')};if(v=='caja'&&R_(V.id)){ST.cur=V.id;save()}ND=null;evc=null;msg='';form=null;conf=null;uf=null;render();document.querySelector('main').scrollTop=0}
const g=i=>document.getElementById(i).value;
function mv(){const ty=g('ty'),s=g('sz'),k=+g('kg'),l=V.id;if(!(k>0)){msg='Ingresa una cantidad mayor a 0.';return render()}
 const d=Math.round((ty=='RECEPCION'?k:-k)*1000);if(bal(l,s)+d<0){msg=`Existencia insuficiente: hay ${f(bal(l,s))} kg en ${s}.`;return render()}
 post(ty,l,s,d/1000);save();msg=`✔ ${ty.replace('_',' ')} registrado: ${d>0?'+':''}${f(d)} kg en ${s}.`;render()}
function rev(id){const x=ST.L.find(y=>y.id===id);if(bal(x.lot,x.size)-x.m<0){msg='No se puede revertir: dejaría existencia negativa.';return render()}post('REVERSA',x.lot,x.size,-x.m/1000,id);save();msg=`✔ Movimiento #${id} revertido.`;render()}
function saveLot(){const o=g('fo').trim(),t=g('ft'),n=+g('fn');if(!o){msg='Escribe el origen.';return render()}if(!(n>=1)){msg='Indica el número de cajas.';return render()}
 if(form.edit){const r=R_(form.edit),b=ST.B[r.lot];if(n<b.length){if(b.slice(n).some(x=>x.c>0||x.d!=null)){msg='No puedes quitar cajas que ya tienen captura o envío.';return render()}b.length=n}else while(b.length<n)b.push({c:null,k:null,d:null});Object.assign(r,{origin:o,tank:t,nb:n})}
 else{const l=g('fl').trim().toUpperCase(),ks=S.map((s,i)=>+g('fk'+i)||0);if(!l){msg='Escribe el número de lote.';return render()}if(R_(l)){msg='Ese lote ya existe.';return render()}if(ks.every(k=>k<=0)){msg='Captura al menos una talla con kg.';return render()}
  const id='R-'+String(121+ST.R.length).padStart(4,'0');ST.R.push({id,lot:l,origin:o,tank:t,nb:n,date:new Date().toLocaleDateString('es-MX'),final:null,closed:false});ST.B[l]=Array.from({length:n},()=>({c:null,k:null,d:null}));ks.forEach((k,i)=>k>0&&post('RECEPCION',l,S[i],k,0,id));V={v:'lote',id:l}}
 form=null;msg='';save();toast('✔ Guardado');render()}
function delLot(){const l=V.id;if(ST.B[l].some(b=>b.d!=null)){conf=null;toast('No se puede eliminar: tiene cajas asignadas a envíos.');return render()}
 ST.R=ST.R.filter(r=>r.lot!==l);delete ST.B[l];ST.L=ST.L.filter(x=>x.lot!==l);save();conf=null;toast('Lote eliminado (en el sistema real: eliminación lógica + auditoría)');go('recepcion')}
function closeLot(l){const r=R_(l),c=calc(l);if(!c)return toast('Captura primero el conteo final.');r.closed=true;save();toast(`✔ Lote cerrado. Mortalidad calculada: ${f(c.dead)} kg (${c.p.toFixed(2)}%).`);render()}
function closeP(i){const p=ST.P[i],bad=[];for(const l in ST.B)ST.B[l].forEach((b,n)=>{if(b.d===i&&!(b.c>0&&b.k))bad.push(`${l} #${n+1}`)});
 if(bad.length)return toast('Faltan datos en cajas: '+bad.slice(0,4).join(', '));if(!boxesOf(i).length)return toast('Asigna cajas capturadas a este envío antes de cerrar.');
 p.closed=true;const x=boxesOf(i),by={R:0,V:0,B:0};x.forEach(o=>by[o.b.k]+=o.b.c);const to=ST.U.filter(u=>u.notify).map(u=>u.email);
 const body=`Empaque cerrado: ${p.n}\nFecha: ${now()}\nCerrado por: ${me.name}\n\nHieleras: ${p.h}\nPeso bruto: ${gross(p).toFixed(1)} kg\nLotes: ${[...new Set(x.map(o=>o.l))].join(', ')}\nCajas capturadas: ${x.length}\nLangostas: ${sent(i)} (Rojo ${by.R} · Verde ${by.V} · Blanco ${by.B})\n\nDetalle por caja:\n`+x.map(o=>`  ${o.l} caja ${o.n+1}: ${o.b.c} ${RC[o.b.k][0]}`).join('\n');
 ST.O.unshift({subject:`[PROPESA] Informe de empaque ${p.n}`,t:now(),to,body});save();toast(`✔ Empaque cerrado. Informe enviado a ${to.length} usuarios (simulado).`);render()}
function saveU(){const n=g('un').trim(),e=g('ue').trim(),pw=g('up'),r=g('ur'),nt=document.querySelector('[data-a=un]').getAttribute('aria-checked')=='true';
 if(!n||!/.+@.+\..+/.test(e)||pw.length<4){msg='Nombre, correo válido y contraseña (4+) son obligatorios.';return render()}
 if(ST.U.some(u=>u.email==e&&u.id!=uf.id)){msg='Ese correo ya existe.';return render()}
 if(uf.id){Object.assign(ST.U.find(u=>u.id==uf.id),{name:n,email:e,pw,role:r,notify:nt})}else ST.U.push({id:Math.max(0,...ST.U.map(u=>u.id))+1,name:n,email:e,pw,role:r,notify:nt});uf=null;msg='';save();toast('✔ Usuario guardado');render()}
document.addEventListener('click',e=>{const sbx=e.target.closest('[data-sb]'),A_=document.getElementById('app');if(sbx)A_.classList.toggle('sbo',sbx.dataset.sb=='1');else if(e.target.closest('[data-go]'))A_.classList.remove('sbo');
const t=e.target,q=s=>t.closest(s);let x;
 if(x=q('[data-q]')){const[a,b]=x.dataset.q.split(',');document.getElementById('le').value=a;document.getElementById('lp').value=b;return}
 if(x=q('[data-st]')){const[i,d]=x.dataset.st.split(',').map(Number),b=ST.B[V.id][i];return boxUp(i,{c:Math.max(0,(b.c||0)+d)})}
 if(x=q('[data-kk]')){const[i,k]=x.dataset.kk.split(',');return boxUp(+i,{k})}
 if(x=q('[data-r]'))return rev(+x.dataset.r);
 if(x=q('[data-eu]')){uf={id:+x.dataset.eu};msg='';return render()}
 if(x=q('[data-du]')){conf='u'+x.dataset.du;return render()}
 if(x=q('[data-du2]')){ST.U=ST.U.filter(u=>u.id!=x.dataset.du2);conf=null;save();toast('Usuario eliminado');return render()}
 if(x=q('[data-a]')){const k=x.dataset.a;
  if(k=='lg'){const u=ST.U.find(u=>u.email==g('le').trim()&&u.pw==g('lp'));if(!u){document.getElementById('lm').textContent='Correo o contraseña incorrectos.';return}me=u;V={v:'inicio'};return render()}
  if(k=='lo'){me=null;return render()}
  if(k=='nf'){form=form?null:{t:'lot'};msg='';return render()}if(k=='el'){form={t:'lot',edit:V.id};msg='';return render()}
  if(k=='sv')return saveLot();if(k=='mv')return mv();if(k=='dl'){conf='lot';return render()}if(k=='dl2')return delLot();
  if(k=='cl')return closeLot(x.dataset.lot||V.id);if(k=='ol'){R_(V.id).closed=false;save();return render()}
  if(k=='tr'){V={v:'buscar',id:g('tl')+' '+g('tn')};return render()}
  if(k=='cp')return closeP(+V.id);if(k=='op'){ST.P[+V.id].closed=false;save();return render()}
  if(k=='nu'){uf={};msg='';return render()}if(k=='cu'){uf=null;return render()}if(k=='su')return saveU();
  if(k=='un'){x.setAttribute('aria-checked',x.getAttribute('aria-checked')!='true');return}
  if(k=='rst'){ST=seed();save();toast('Demo restablecida');return render()}return}
 if(x=q('[data-go]'))go(x.dataset.go)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'){const d=e.target.dataset||{};if(d.go)go(d.go);else if(e.target.id=='lp')document.querySelector('[data-a=lg]').click();else if(e.target.id=='sq'){V={v:'buscar',id:e.target.value};render()}}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset||{};
 if(d.c!=null)return boxUp(+d.c,{c:Math.max(0,Math.floor(+t.value)||0)});
 if(d.d!=null)return boxUp(+d.d,{d:t.value===''?null:+t.value});
 if(d.k&&d.j!=null){ST.P[+V.id].c[+d.j][+d.k]=Math.max(0,+t.value||0);save();return render()}
 if(d.alive!=null){const i=+d.alive,n=sent(i);ST.P[i].alive=t.value===''?null:Math.min(n,Math.max(0,Math.floor(+t.value)||0));save();return render()}
 if(d.fin!=null){const r=R_(d.fin),v=t.value===''?null:+t.value;if(v!=null&&(v<0||Math.round(v*1000)>bal(r.lot))){toast(`El conteo final no puede ser mayor al esperado (${f(bal(r.lot))} kg).`);return render()}r.final=v;save();return render()}
 if(t.id=='gt'){const el=document.getElementById('bx'+(+t.value-1));if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.style.outline='2px solid var(--ac)'}}});
render();
</script></body></html>
